apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-svc-proxy
  labels:
    app: internal-svc-proxy
spec:
  replicas: {{ .Values.proxy.replicas }}
  selector:
    matchLabels:
      app: internal-svc-proxy
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/proxy-config.yaml") . | sha256sum }}
      labels:
        app: internal-svc-proxy
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: internal-svc-proxy
      containers:
        - name: nginx
          image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: internal-svc-proxy
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: internal-svc-proxy
  labels:
    app: internal-svc-proxy
spec:
  selector:
    app: internal-svc-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
