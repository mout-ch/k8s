{{- range $key, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $key }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $.Values.ingress.clusterIssuer }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Values.ingress.middlewares }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls:
    - hosts:
        - {{ $svc.host }}
      secretName: {{ $svc.host }}-tls
  rules:
    - host: {{ $svc.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: internal-svc-proxy
                port:
                  name: http
{{- end }}
{{- end }}
