---
image:
  repository: registry.gitlab.com/mout.ch/monitoring-bridge
  # Short SHA pushed by the project's CI from main (git tags are pushed too).
  tag: 7fd25543
  pullPolicy: IfNotPresent

# Vault secret mout.ch/monitoring-bridge, field "discord_webhook", exposed to
# the app as DISCORD_WEBHOOK_URL (used as ${DISCORD_WEBHOOK_URL} below).
vaultSecret:
  path: mout.ch/monitoring-bridge

logLevel: info

# Rendered as-is into config.yaml. See config.example.yaml in the project.
config:
  triggers:
    discord:
      type: discord
      webhook_url: "${DISCORD_WEBHOOK_URL}"

  monitors:
    # Torrent clients must only announce through the VPN. Fails as soon as one
    # of the sites' real public addresses shows up on
    # https://ipleak.net/?thash=5d6faa2372b1d9b5318ce798edf590b881781d0f
    # Host names are resolved (A + AAAA) on every check; "/64" widens IPv6
    # results to their /64. A resolution error also fails the check.
    - name: torrent-vpn-leak
      type: ipleak_torrent
      interval: 60m
      timeout: 30s
      failure_threshold: 1
      triggers: [discord]
      torrent_hash: 5d6faa2372b1d9b5318ce798edf590b881781d0f
      reference_ips:
        - magstatt.infra.mout.ch/64
        - blotzheim.infra.mout.ch/64
        - hirsingue.infra.mout.ch/64
        # These names have no AAAA record yet, but theater-1 (Magstatt) does
        # go out over IPv6: keep its prefix until an AAAA record exists.
        - 2a01:e0a:10ba:6a0::/64
      expect: absent
      # Only recent announces count, so the alert clears an hour after a leak.
      max_age: 1h

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 200m
    memory: 64Mi
