---
postgres-operator:
  configGeneral:
    # Patroni keeps its HA state in ConfigMaps (Endpoints are deprecated).
    # Only switch this with a single instance per cluster (split-brain risk).
    kubernetes_use_configmaps: true
  configKubernetes:
    enable_cross_namespace_secret: true
    pod_environment_configmap: "mout-ch-custom-config"
  configMajorVersionUpgrade:
    major_version_upgrade_mode: "full"
