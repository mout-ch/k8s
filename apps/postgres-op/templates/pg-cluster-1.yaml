---
apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: mout-ch-pg-cluster-1
  namespace: postgres-op
spec:
  teamId: "mout-ch"
  volume:
    size: 70Gi
    storageClass: csi-rbd-sc
  numberOfInstances: 2
  users:
    rootmout:
    - superuser
    - createdb
    # prefixed with owncloud. to make secret available on owncloud namespace
    nextcloud.nextcloud: []
    cocovoit.cocovoit: []
    epibank.epibank: []
    simone.simone: []
    goauthentik.goauthentik: []
    firefly.firefly: []
    immich.immich:
    - createdb
    - createrole
  databases:
    nextcloud: nextcloud.nextcloud
    cocovoit: cocovoit.cocovoit
    epibank: epibank.epibank
    simone: simone.simone
    goauthentik: goauthentik.goauthentik
    firefly: firefly.firefly
  preparedDatabases:
    immich:
      defaultUsers: true
      extensions:
        pgvector: "public"
        cube: "public"
        earthdistance: "public"
      schemas:
        data:
          defaultRoles: true
  postgresql:
    version: "15"
    parameters:
      max_connections: "200"
      shared_buffers: "512MB"
      effective_cache_size: "2GB"
      maintenance_work_mem: "256MB"
      work_mem: "16MB"
      max_wal_size: "2GB"
      min_wal_size: "1GB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi
