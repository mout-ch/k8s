---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-controller
  namespace: unifi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unifi-controller
  template:
    metadata:
      labels:
        app: unifi-controller
    spec:
      nodeSelector:
        kubernetes.io/hostname: theater-1
      containers:
      - name: unifi
        image: lscr.io/linuxserver/unifi-network-application:10.3.58-ls131
        env:
        - name: TZ
          value: "Europe/Zurich"
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        - name: controller
          containerPort: 8080
          protocol: TCP
        - name: stun
          containerPort: 3478
          protocol: UDP
        - name: discovery
          containerPort: 10001
          protocol: UDP
        - name: speedtest
          containerPort: 6789
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /status
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /status
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: unifi-config
---
apiVersion: v1
kind: Service
metadata:
  name: unifi-controller
  namespace: unifi
spec:
  type: NodePort
  selector:
    app: unifi-controller
  ports:
  - name: https
    port: 8443
    targetPort: 8443
    nodePort: 30443
    protocol: TCP
  - name: controller
    port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
  - name: stun
    port: 3478
    targetPort: 3478
    nodePort: 30478
    protocol: UDP
  - name: discovery
    port: 10001
    targetPort: 10001
    nodePort: 30001
    protocol: UDP
  - name: speedtest
    port: 6789
    targetPort: 6789
    nodePort: 30789
    protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifi-config
  namespace: unifi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
