---
ceph-csi-rbd:
  csiConfig:
    - clusterID: af88c536-4b0e-11ee-ad59-67497ccf2e7a
      monitors:
        - "192.168.14.10:6789"
        - "192.168.14.11:6789"
        - "192.168.14.12:6789"

  provisioner:
    replicaCount: 1

  # Value of the live CSIDriver since 2023. The field is immutable: the chart
  # default ("File") would need the CSIDriver deleted and recreated.
  CSIDriver:
    fsGroupPolicy: ReadWriteOnceWithFSType

  # Defined in templates/storageclass.yaml instead: StorageClass parameters are
  # immutable and chart upgrades keep changing them (3.14 dropped thickProvision,
  # 3.15 adds a controller-publish secret), each time forcing a delete/recreate.
  storageClass:
    create: false

storageClass:
  name: csi-rbd-sc
  clusterID: af88c536-4b0e-11ee-ad59-67497ccf2e7a
  pool: k3s
  # Ceph credentials (VaultSecret, templates/secret.yaml).
  secret: csi-rbd-secret
  mountOptions:
    - discard
