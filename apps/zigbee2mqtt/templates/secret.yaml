---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: mqtt-account
spec:
  path: apps/zigbee2mqtt/mqtt-account
  type: Opaque
  # The chart mounts the "secret.yaml" key at /app/data/secret.yaml, read by
  # the '!secret.yaml user' / '!secret.yaml password' references in values.yaml.
  # Without this key Kubernetes mounts an empty directory instead (EISDIR).
  templates:
    user: "{% .Secrets.user %}"
    password: "{% .Secrets.password %}"
    secret.yaml: |
      user: "{% .Secrets.user %}"
      password: "{% .Secrets.password %}"
