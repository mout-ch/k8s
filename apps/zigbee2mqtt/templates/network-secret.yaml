---
# Zigbee network key, kept apart from the MQTT credentials. In Vault, the
# "network_key" field holds the key as a zigbee2mqtt list of 16 bytes: [12, 34, ...]
# (the coordinator's key, see network_key.key in coordinator_backup.json).
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: zigbee2mqtt-network
spec:
  path: apps/zigbee2mqtt/network
  type: Opaque
  templates:
    network.yaml: |
      network_key: {% .Secrets.network_key %}
