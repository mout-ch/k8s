{{- if .Values.vaultSecret.enabled }}
---
# Vault fields: "username" and "password" of the MQTT account.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: {{ .Values.mqtt.existingSecret }}
  labels:
    {{- include "qlcplus-mqtt-bridge.labels" . | nindent 4 }}
spec:
  path: {{ .Values.vaultSecret.path }}
  type: Opaque
  keys:
    - username
    - password
{{- end }}
