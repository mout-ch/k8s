---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "qlcplus-mqtt-bridge.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Two bridges subscribed at once would send every command to QLC+ twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "qlcplus-mqtt-bridge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qlcplus-mqtt-bridge.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image is FROM scratch and runs as nobody.
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No port and no health endpoint: it only connects out, and exits
          # (then gets restarted) on unrecoverable errors.
          env:
            - name: MQTT_BROKER
              value: {{ .Values.mqtt.broker | quote }}
            - name: MQTT_PORT
              value: {{ .Values.mqtt.port | quote }}
            - name: MQTT_TOPIC
              value: {{ .Values.mqtt.topic | quote }}
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mqtt.existingSecret }}
                  key: username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mqtt.existingSecret }}
                  key: password
            - name: WEBSOCKET_URI
              value: {{ .Values.qlcplus.websocketUri | quote }}
            - name: CMD
              value: {{ .Values.qlcplus.cmd | quote }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
