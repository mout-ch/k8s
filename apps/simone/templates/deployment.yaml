---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simone
spec:
  selector:
    matchLabels:
      app: simone
  replicas: 1
  template:
    metadata:
      labels:
        app: simone
    spec:
      imagePullSecrets:
        - name: simone-registry
      containers:
      - name: simone
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - name: http
          containerPort: {{ .Values.port }}
        readinessProbe:
          httpGet:
            path: {{ .Values.healthPath }}
            port: http
        livenessProbe:
          httpGet:
            path: {{ .Values.healthPath }}
            port: http
          initialDelaySeconds: 10
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        env:
          - name: DB_HOST
            value: {{ .Values.database.host | quote }}
          - name: DB_PORT
            value: {{ .Values.database.port | quote }}
          - name: DB_NAME
            value: {{ .Values.database.name | quote }}
          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.database.credentialsSecret }}
                key: username
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.database.credentialsSecret }}
                key: password
          # Built from the variables above, which must come first.
          - name: DATABASE_URL
            value: "postgres://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: simone-app
                key: jwt
          {{- with .Values.extraEnv }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
