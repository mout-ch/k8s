---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simone
spec:
  selector:
    matchLabels:
      app: simone
  replicas: 1
  template:
    metadata:
      labels:
        app: simone
    spec:
      imagePullSecrets:
        - name: simone-registry
      containers:
      - name: simone
        image: registry.gitlab.com/kelbert-web-services/simone:v2.0.0
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        env:
          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: simone
                key: db_name

          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: simone
                key: db_host

          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: simone
                key: db_port

          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: simone.simone.mout-ch-pg-cluster-1.credentials.postgresql.acid.zalan.do
                key: username
                optional: false

          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: simone.simone.mout-ch-pg-cluster-1.credentials.postgresql.acid.zalan.do
                key: password
                optional: false

          # built from the variables above, which must come first
          - name: DATABASE_URL
            value: "postgres://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"

          # session signing key, at least 32 characters: a new `jwt` key under apps/simone/app in Vault
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: simone-app
                key: jwt
