---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: simone-app
spec:
  path: {{ .Values.vault.app }}
  type: Opaque
  keys:
    - jwt

---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: simone-registry
spec:
  type: kubernetes.io/dockerconfigjson
  path: {{ .Values.vault.registry }}
  keys:
    - host
    - username
    - password
  templates:
    ".dockerconfigjson": |
      {
          "auths": {
              "{% .Secrets.host %}":{
                  "username":"{% .Secrets.username %}",
                  "password":"{% .Secrets.password %}",
                  "auth":"{% list .Secrets.username ":" .Secrets.password | join "" | b64enc %}"
              }
          }
      }
