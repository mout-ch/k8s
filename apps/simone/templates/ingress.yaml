---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simone-ingress
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.ingress.middlewares | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.domain | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: simone
            port:
              name: http
  tls:
    - hosts:
      - {{ .Values.domain | quote }}
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
