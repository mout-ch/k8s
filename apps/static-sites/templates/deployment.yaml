apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-sites
  labels:
    app: static-sites
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: static-sites
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app: static-sites
    spec:
      # Spread replicas so one node going down does not take every site down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: static-sites
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: static-sites-nginx
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: static-sites
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: static-sites
---
apiVersion: v1
kind: Service
metadata:
  name: static-sites
  labels:
    app: static-sites
spec:
  type: ClusterIP
  selector:
    app: static-sites
  ports:
    - name: http
      port: 80
      targetPort: http
