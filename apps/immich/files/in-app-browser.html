<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --card: #fff; --accent: #4250af; --line: #e2e2dc;
          --on-accent: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ededea; --muted: #a3a39c; --card: #1f1f1d; --accent: #8c98e8; --line: #33332f; --on-accent: #151514; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px 22px; text-align: center; }
  .logo { display: block; width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; }
  .btn { display: block; width: 100%; padding: 14px 16px; border-radius: 12px; border: 0; font: inherit; font-weight: 600;
         text-align: center; text-decoration: none; cursor: pointer; margin-bottom: 10px; }
  .primary { background: var(--accent); color: var(--on-accent); }
  .secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .help { font-size: .9rem; color: var(--muted); margin: 6px 0 14px; }
  .help b { color: var(--fg); font-weight: 600; }
  .stay { font-size: .85rem; color: var(--muted); }

  [hidden] { display: none !important; }
</style>

<script>
  (function () {
    var url = new URL(window.location.href);
    var ua = navigator.userAgent;
    var ios = /iPhone|iPad|iPod/.test(ua);
    var android = /Android/.test(ua);
    var open = document.getElementById("open");

    if (android) {
      // Hands the URL to Chrome; Android falls back to the URL if it is missing.
      open.href = "intent://" + url.host + url.pathname + url.search + url.hash +
        "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" +
        encodeURIComponent(url.href) + ";end";
      open.textContent = "Ouvrir dans Chrome";
      open.hidden = false;
    } else if (ios) {
      // iOS 17+: opens Safari from in-app browsers that allow it.
      open.href = "x-safari-" + url.href;
      open.textContent = "Ouvrir dans Safari";
      open.hidden = false;
      document.getElementById("help-ios").hidden = false;
      document.getElementById("help-other").hidden = true;
    }

    document.getElementById("copy").addEventListener("click", function () {
      var btn = this;
      var done = function () { btn.textContent = "Lien copié ✓"; };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url.href).then(done, function () { window.prompt("Copiez ce lien :", url.href); });
      } else {
        window.prompt("Copiez ce lien :", url.href);
      }
    });

    var stay = new URL(url.href);
    stay.searchParams.set("stay", "1");
    document.getElementById("stay").href = stay.pathname + stay.search + stay.hash;
  })();
</script>
