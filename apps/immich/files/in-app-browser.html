<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ouvrir dans votre navigateur</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --card: #fff; --accent: #4250af; --line: #e2e2dc;
          --on-accent: #fff; --badge: #e7e9f7; --wool: #ffffff; --wool-shade: #eceae4; --skin: #3b3936; --cheek: #f3a6a0; --shadow: rgba(29,29,27,.14); }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ededea; --muted: #a3a39c; --card: #1f1f1d; --accent: #8c98e8; --line: #33332f;
          --badge: #3a3f63; --wool: #f4f3ef; --wool-shade: #d9d7d0; --skin: #1b1a18; --on-accent: #151514; --shadow: rgba(0,0,0,.35); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px 22px; text-align: center; }
  .logo { display: block; width: 112px; height: 112px; margin: 0 auto 18px; }
  .btn { display: block; width: 100%; padding: 14px 16px; border-radius: 12px; border: 0; font: inherit; font-weight: 600;
         text-align: center; text-decoration: none; cursor: pointer; margin-bottom: 10px; }
  .primary { background: var(--accent); color: var(--on-accent); }
  .secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .help { font-size: .9rem; color: var(--muted); margin: 6px 0 14px; }
  .help b { color: var(--fg); font-weight: 600; }
  .stay { font-size: .85rem; color: var(--muted); }

  /* Sheep: a gentle hop, a nodding head, a wagging tail and the odd blink. */
  .sheep, .shadow, .head, .tail, .eye { transform-box: fill-box; }
  .sheep  { animation: hop 1.8s ease-in-out infinite; }
  .shadow { transform-origin: center; animation: squash 1.8s ease-in-out infinite; }
  .head   { transform-origin: 20% 80%; animation: nod 1.8s ease-in-out infinite; }
  .tail   { transform-origin: 100% 50%; animation: wag .9s ease-in-out infinite; }
  .eye    { transform-origin: center; animation: blink 4s infinite; }
  @keyframes hop    { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-7px); } 60% { transform: translateY(-6px); } }
  @keyframes squash { 0%, 100% { transform: scaleX(1); opacity: 1; } 45%, 60% { transform: scaleX(.78); opacity: .6; } }
  @keyframes nod    { 0%, 100% { transform: rotate(0); } 45% { transform: rotate(-7deg); } }
  @keyframes wag    { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(14deg); } }
  @keyframes blink  { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @media (prefers-reduced-motion: reduce) { .sheep, .shadow, .head, .tail, .eye { animation: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 120 120" role="img" aria-label="Mouton">
    <circle cx="60" cy="60" r="58" fill="var(--badge)"/>
    <ellipse class="shadow" cx="57" cy="97" rx="27" ry="4" fill="var(--shadow)"/>
    <g class="sheep">
      <g fill="var(--skin)">
        <rect x="40" y="72" width="7" height="22" rx="3.5"/>
        <rect x="51" y="74" width="7" height="20" rx="3.5"/>
        <rect x="63" y="74" width="7" height="20" rx="3.5"/>
        <rect x="74" y="72" width="7" height="22" rx="3.5"/>
      </g>
      <circle class="tail" cx="27" cy="58" r="7" fill="var(--wool-shade)"/>
      <g fill="var(--wool-shade)">
        <circle cx="38" cy="70" r="13"/><circle cx="56" cy="74" r="14"/><circle cx="74" cy="70" r="12"/>
      </g>
      <g fill="var(--wool)">
        <circle cx="36" cy="58" r="13"/><circle cx="50" cy="49" r="15"/><circle cx="66" cy="50" r="14"/>
        <circle cx="76" cy="60" r="12"/><circle cx="46" cy="66" r="14"/><circle cx="62" cy="66" r="14"/>
      </g>
      <g class="head">
        <ellipse cx="78" cy="49" rx="8" ry="3.6" transform="rotate(-28 78 49)" fill="var(--skin)"/>
        <ellipse cx="88" cy="58" rx="11.5" ry="13.5" fill="var(--skin)"/>
        <circle cx="84" cy="45.5" r="6" fill="var(--wool)"/><circle cx="91" cy="44.5" r="5" fill="var(--wool)"/>
        <g class="eye"><circle cx="92" cy="55.5" r="2.8" fill="#fff"/><circle cx="92.8" cy="55.8" r="1.4" fill="#1d1d1b"/></g>
        <circle cx="94.5" cy="64" r="2.3" fill="var(--cheek)" opacity=".75"/>
      </g>
    </g>
  </svg>

  <a class="btn primary" id="open" hidden>Ouvrir dans le navigateur</a>
  <button class="btn secondary" id="copy" type="button">Copier le lien</button>

  <div class="help" id="help-ios" hidden>ou <b>⋯</b> → <b>Ouvrir dans Safari</b></div>
  <div class="help" id="help-other">ou <b>⋮</b> → <b>Ouvrir dans le navigateur</b></div>

  <a class="stay" id="stay">Rester ici</a>
</main>
<script>
  (function () {
    var url = new URL(window.location.href);
    var ua = navigator.userAgent;
    var ios = /iPhone|iPad|iPod/.test(ua);
    var android = /Android/.test(ua);
    var open = document.getElementById("open");

    if (android) {
      // Hands the URL to Chrome; Android falls back to the URL if it is missing.
      open.href = "intent://" + url.host + url.pathname + url.search + url.hash +
        "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" +
        encodeURIComponent(url.href) + ";end";
      open.textContent = "Ouvrir dans Chrome";
      open.hidden = false;
    } else if (ios) {
      // iOS 17+: opens Safari from in-app browsers that allow it.
      open.href = "x-safari-" + url.href;
      open.textContent = "Ouvrir dans Safari";
      open.hidden = false;
      document.getElementById("help-ios").hidden = false;
      document.getElementById("help-other").hidden = true;
    }

    document.getElementById("copy").addEventListener("click", function () {
      var btn = this;
      var done = function () { btn.textContent = "Lien copié ✓"; };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url.href).then(done, function () { window.prompt("Copiez ce lien :", url.href); });
      } else {
        window.prompt("Copiez ce lien :", url.href);
      }
    });

    var stay = new URL(url.href);
    stay.searchParams.set("stay", "1");
    document.getElementById("stay").href = stay.pathname + stay.search + stay.hash;
  })();
</script>
</body>
</html>
