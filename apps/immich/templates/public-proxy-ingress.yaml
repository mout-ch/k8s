apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-public-proxy
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.ingress.middlewares | quote }}
    traefik.ingress.kubernetes.io/frontend-entry-points: "http,https"
    traefik.ingress.kubernetes.io/redirect-entry-point: "https"
    traefik.ingress.kubernetes.io/redirect-permanent: "true"
    # Above the main Immich route (priority 50) for the same host.
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  rules:
  - host: {{ .Values.domain | quote }}
    http:
      paths:
      - path: "/share"
        pathType: Prefix
        backend:
          service:
            name: immich-public-proxy
            port:
              number: 3000
      - path: "/upload"
        pathType: Prefix
        backend:
          service:
            name: immich-public-proxy-upload
            port:
              number: 3000
  tls:
  - hosts:
    - {{ .Values.domain | quote }}
    secretName: {{ .Values.ingress.tlsSecretName | quote }}
