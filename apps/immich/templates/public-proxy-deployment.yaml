apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-public-proxy
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-public-proxy
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/public-proxy-config.yaml") . | sha256sum }}
      labels:
        app: immich-public-proxy
    spec:
      containers:
      - name: immich-public-proxy
        image: "{{ .Values.publicProxy.image.repository }}:{{ .Values.publicProxy.image.tag }}"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: IMMICH_URL
          value: "http://immich-server.{{ .Release.Namespace }}.svc.cluster.local:2283"
        - name: PUBLIC_BASE_URL
          value: "https://{{ .Values.domain }}"
        volumeMounts:
        - name: config
          mountPath: /app/config.json
          subPath: config.json
        resources:
          {{- toYaml .Values.publicProxy.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: immich-public-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: immich-public-proxy
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: immich-public-proxy
  ports:
  - port: 3000
    targetPort: 3000
    name: http
