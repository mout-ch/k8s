---
# Immich (server, machine learning, Redis) with its database on the shared
# Zalando cluster (apps/postgres-op), plus Immich Public Proxy for shares.

timezone: Europe/Zurich
logLevel: log

domain: photos.kelbert.fr

ingress:
  className: traefik
  clusterIssuer: letsencrypt-prod
  middlewares: kube-system-redirect-https@kubernetescrd
  tlsSecretName: photos-kelbert-fr-tls

database:
  host: mout-ch-pg-cluster-1.postgres-op.svc.cluster.local
  port: 5432
  name: immich
  user: immich.immich
  # Created by the Zalando operator in this namespace (cross-namespace secret).
  passwordSecret: immich.immich.mout-ch-pg-cluster-1.credentials.postgresql.acid.zalan.do
  # Only used by the init container waiting for the database (pg_isready).
  waitImage: postgres:14-alpine

server:
  image:
    repository: ghcr.io/immich-app/immich-server
    tag: v3.3.1
  extraEnv:
    - name: IMMICH_SKIP_IMPORT_CHECK
      value: "true"
    - name: REVERSE_GEOCODING_ENABLED
      value: "false"
    - name: DB_SKIP_MIGRATIONS
      value: "false"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  library:
    size: 100Gi
    storageClass: csi-rbd-sc

machineLearning:
  # Set to 0 to pause machine learning (smart search, faces, OCR).
  replicas: 1
  # Must match server.image.tag.
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    tag: v3.3.1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  cache:
    size: 5Gi
    storageClass: csi-rbd-sc

redis:
  image:
    repository: redis
    tag: 7-alpine
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  storage:
    size: 2Gi
    storageClass: csi-rbd-sc

# Gallery for public shares (/share). Its options are in files/public-proxy-config.json.
publicProxy:
  image:
    repository: ghcr.io/alangrainger/immich-public-proxy
    tag: 4.0.0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Visitor uploads into shares that allow it (/upload).
  upload:
    image:
      repository: ghcr.io/alangrainger/immich-public-proxy-upload
      tag: 4.0.0
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
