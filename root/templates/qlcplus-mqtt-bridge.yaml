---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qlcplus-mqtt-bridge
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: theater-1.magstatt
    namespace: qlcplus
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  source:
    path: apps/qlcplus-mqtt-bridge
    repoURL: https://gitlab.com/mout.ch/k8s.git
    targetRevision: HEAD
