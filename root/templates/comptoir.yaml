---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: comptoir
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: comptoir
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  source:
    path: apps/comptoir
    repoURL: https://gitlab.com/mout.ch/k8s.git
    targetRevision: HEAD
